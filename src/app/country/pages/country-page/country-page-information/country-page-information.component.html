<section class="mx-10">
  <h1 class="text-3xl">{{country().nameCommon}}</h1>
  <h2 class="text-xl font-thin"> Poblacion: {{country().population | number }}</h2>
  <section>
    <div class="stats shadow">
      <div class="stat place-items-center">
        <div class="stat-figure text-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-8 w-8 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div class="stat-title">Poblacion</div>
        <div class="stat-value">{{country().population }}</div>
        <div class="stat-desc">{{currentDate()}}</div>
      </div>

      <div class="stat place-items-center">
        <div class="stat-figure text-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-8 w-8 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">
            </path>
          </svg>
        </div>
        <div class="stat-title">Nombre</div>
        <div class="stat-value">{{country().nameCommon}}</div>

      </div>

      <div class="stat place-items-center">
        <div class="stat-figure text-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-8 w-8 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
          </svg>
        </div>
        <div class="stat-title">Region</div>
        <div class="stat-value">{{country().region}}</div>
        <div class="stat-desc">{{country().subRegion}}</div>
      </div>
    </div>

  </section>
 <section>
  <figure class="diff aspect-16/9" tabindex="0">
  <div class="diff-item-1" role="img" tabindex="0">
    <img [alt]="country().nameCommon"
      [src]="country().flagUrl"/>
  </div>
  <div class="diff-item-2" role="img">
    <img
      class="blur brightness-75"
      alt="daisy"
      [src]="country().flagUrl" />
  </div>
  <div class="diff-resizer"></div>
</figure>
 </section>
</section>
